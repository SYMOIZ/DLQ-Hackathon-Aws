[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlq-judge"
version = "1.0.0"
description = "Triage SQS dead-letter queues with Strands Decider 2B + Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Syed Moiz" }]
dependencies = [
  "strands-agents==1.61.1",
  "strands-decider==0.1.0",
  "boto3==1.43.114",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
dlq-judge = "dlq_judge.cli:main"

[tool.setuptools.packages.find]
include = ["dlq_judge*", "agent*", "patterns*", "bench*"]

[tool.setuptools.package-dir]
"patterns.confidence_gated_action" = "patterns/confidence_gated_action"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "aws: integration tests that need a live AWS stack",
]
